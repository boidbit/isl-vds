name: Render film

# Actions tab > "Render film" > Run workflow. Downloads appear under the run's "Artifacts".
on:
  workflow_dispatch:
    inputs:
      film:
        description: "Film id (folder name in /films)"
        required: true
        default: pyasa-kutta
      lang:
        description: "Language track: ur (Urdu/Hindi channel), en (English channel) or both"
        type: choice
        options: [ur, en, both]
        default: ur
      voice:
        description: "Generate narration with Gemini"
        type: boolean
        default: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FILM: ${{ inputs.film }}
      LANGS: ${{ inputs.lang == 'both' && 'ur en' || inputs.lang }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure ffmpeg is available (voice treatment)
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Check film (missing assets / scenes)
        run: npm run validate:films -- "$FILM"
      - name: Narration (Gemini TTS)
        if: inputs.voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # optional second key for the English track (own quota); falls back to GEMINI_API_KEY
          GEMINI_API_KEY_EN: ${{ secrets.GEMINI_API_KEY_EN }}
        run: for L in $LANGS; do npm run voice -- "$FILM" --lang "$L"; done
      - name: Render video
        run: |
          for L in $LANGS; do
            if [ "$L" = ur ]; then ID="film-$FILM"; OUT="out/$FILM.mp4"; else ID="film-$FILM-$L"; OUT="out/$FILM-$L.mp4"; fi
            npx remotion render src/index.ts "$ID" "$OUT" --crf=18
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.film }}-video
          path: |
            out/*.mp4
            public/voice/${{ inputs.film }}/
            public/voice/${{ inputs.film }}-en/
          retention-days: 14

name: Render film

# Actions tab > "Render film" > Run workflow, or open an issue titled "render: <film-id> both" (see issue-command.yml),
# or the "Render" button on the videos page. Videos go to the release "film-<id>" and the videos page is rebuilt.
on:
  workflow_dispatch:
    inputs:
      film:
        description: "Film id (folder name in /films)"
        required: true
        default: pyasa-kutta
      lang:
        description: "Language track: ur (Urdu/Hindi channel), en (English channel) or both"
        type: choice
        options: [ur, en, both]
        default: ur
      voice:
        description: "Generate narration with Gemini"
        type: boolean
        default: true
  workflow_call:
    inputs:
      film: { type: string, required: true }
      lang: { type: string, default: both }
      voice: { type: boolean, default: true }
      ref: { type: string, default: "" }

permissions:
  contents: write
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 200 # long Shorts with motion blur, cel shading and two languages take 1.5-2 h
    env:
      FILM: ${{ inputs.film }}
      LANGS: ${{ inputs.lang == 'both' && 'ur en' || inputs.lang }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure ffmpeg is available (voice treatment)
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Check film (missing assets / scenes)
        run: npm run validate:films -- "$FILM"
      - name: Narration (Gemini TTS)
        if: inputs.voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # optional second key for the English track (own quota); falls back to GEMINI_API_KEY
          GEMINI_API_KEY_EN: ${{ secrets.GEMINI_API_KEY_EN }}
        run: for L in $LANGS; do npm run voice -- "$FILM" --lang "$L"; done
      - name: Render video (+ small preview and poster for the videos page)
        run: |
          for L in $LANGS; do
            if [ "$L" = ur ]; then ID="film-$FILM"; N="$FILM"; else ID="film-$FILM-$L"; N="$FILM-$L"; fi
            npx remotion render src/index.ts "$ID" "out/$N.mp4" --crf=18
            ffmpeg -hide_banner -loglevel error -y -i "out/$N.mp4" -vf "scale=720:-2" -c:v libx264 -crf 28 -preset slow \
              -c:a aac -b:a 96k -movflags +faststart "out/$N-preview.mp4"
            ffmpeg -hide_banner -loglevel error -y -ss 1.2 -i "out/$N.mp4" -frames:v 1 -vf "scale=480:-2" "out/$N.jpg"
            if node -e "process.exit(require('./films/$FILM/film.json').thumbnail ? 0 : 1)"; then
              T="thumb-$FILM"; [ "$L" = ur ] || T="thumb-$FILM-$L"
              npx remotion still src/index.ts "$T" "out/$N-thumb.png"
            fi
          done
          npx tsx scripts/film-meta.ts "$FILM" "$LANGS"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.film }}-video
          path: |
            out/
            public/voice/${{ inputs.film }}/
            public/voice/${{ inputs.film }}-en/
          retention-days: 14
      - name: Publish to release film-<id> and rebuild the videos page
        run: |
          TAG="film-$FILM"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$FILM" --notes "Rendered videos of films/$FILM (Urdu + English). Videos page: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" --latest=false
          if [ "$LANGS" != "ur en" ] && gh release download "$TAG" -p meta.json -D old 2>/dev/null; then
            # keep the other language's entry when only one language was rendered
            node -e 'const f=require("fs");const o=JSON.parse(f.readFileSync("old/meta.json"));const n=JSON.parse(f.readFileSync("out/meta.json"));n.videos={...o.videos,...n.videos};f.writeFileSync("out/meta.json",JSON.stringify(n,null,2))'
          fi
          gh release upload "$TAG" out/*.mp4 out/*.jpg out/meta.json $(ls out/*-thumb.png 2>/dev/null) --clobber
          gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}" || echo "pages.yml not on the default branch yet"

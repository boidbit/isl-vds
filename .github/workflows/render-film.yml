name: Render film

# Actions tab > "Render film" > Run workflow. Downloads appear under the run's "Artifacts".
on:
  workflow_dispatch:
    inputs:
      film:
        description: "Film id (folder name in /films)"
        required: true
        default: pyasa-kutta
      voice:
        description: "Generate narration with Gemini"
        type: boolean
        default: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FILM: ${{ inputs.film }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check film (missing assets / scenes)
        run: npm run validate:films -- "$FILM"
      - name: Narration (Gemini TTS)
        if: inputs.voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run voice -- "$FILM"
      - name: Render video
        run: npx remotion render src/index.ts "film-$FILM" "out/$FILM.mp4" --crf=18
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.film }}-video
          path: |
            out/*.mp4
            public/voice/${{ inputs.film }}/
          retention-days: 14

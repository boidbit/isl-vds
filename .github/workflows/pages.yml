name: Videos page

# Builds the GitHub Pages site from site/ + every "film-*" release (preview video, poster, meta.json).
# One-time setup: Settings > Pages > Source: "GitHub Actions".
on:
  workflow_dispatch:
  push:
    paths: [site/**, scripts/build-site.mjs, .github/workflows/pages.yml, films/*/film.json]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # deploy only from the default branch (Pages only accepts it); a manual run always builds
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect rendered films from releases
        run: |
          mkdir -p _site/videos
          cp -r site/. _site/
          for TAG in $(gh release list --limit 300 --json tagName -q '.[].tagName' | grep '^film-' || true); do
            ID="${TAG#film-}"
            gh release download "$TAG" -D "_site/videos/$ID" -p 'meta.json' -p '*-preview.mp4' -p '*.jpg' -p '*-thumb.png' --clobber || true
          done
          node scripts/build-site.mjs _site
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

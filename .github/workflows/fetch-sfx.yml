name: Fetch sounds (Freesound CC0)

# Actions > "Fetch sounds" > Run workflow (Claude runs it from chat). Uses the repository secret FREESOUND_API_KEY.
#   sounds: one per line (or ;), "<name>: <search words> [--id N] [--max S] [--loud L] [--filter F]"
#           e.g. "rooster: rooster crow --max 3 --loud -18; rain: light rain --loud -22"
#   list:   true = only show the best CC0 matches in the run summary, change nothing
# A fetch commits public/sfx/real + the registry to the branch "sfx/<run id>" (then a PR is opened and merged).
on:
  workflow_dispatch:
    inputs:
      sounds:
        description: "name: search words [--id N] [--max S] [--loud L] (one per line or ;)"
        required: true
      list:
        description: "Only list matches (no download)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      SOUNDS: ${{ inputs.sounds }}
      LIST: ${{ inputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Fetch
        run: |
          [ -n "$FREESOUND_API_KEY" ] || { echo "::error title=Freesound key nahi mili::Settings > Secrets and variables > Actions > New repository secret: FREESOUND_API_KEY"; exit 1; }
          set -f
          printf '%s\n' "$SOUNDS" | tr ';' '\n' | while IFS= read -r line; do
            line="$(echo "$line" | sed 's/^ *//; s/ *$//')"; [ -z "$line" ] && continue
            name="${line%%:*}"; rest="${line#*:}"
            query="$(echo "$rest" | sed 's/ --.*//; s/^ *//')"; opts="$(echo "$rest" | grep -o ' --.*' || true)"
            echo "### $name ($query)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$LIST" = true ]; then
              npm run -s fetch:sfx -- "$name" "$query" --list $opts | tee -a "$GITHUB_STEP_SUMMARY"
            else
              npm run -s fetch:sfx -- "$name" "$query" $opts | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            echo >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Commit to sfx/<run id>
        if: ${{ !inputs.list }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "sfx/${{ github.run_id }}"
          git add public/sfx/real src/two-d/library/registry.ts
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Sounds from Freesound (CC0): $(git diff --cached --name-only public/sfx/real | grep -o '[a-z0-9-]*\.mp3' | tr '\n' ' ')"
          git push origin "sfx/${{ github.run_id }}"
          echo "Branch: sfx/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
